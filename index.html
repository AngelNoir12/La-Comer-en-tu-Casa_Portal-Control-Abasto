<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Comer en tu Casa: Portal de Control & Abasto</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            comer: {
              orange: '#FF6600',
              yellow: '#FFB800',
              green: '#73A500',
              dark: '#1A1A1A',
              gray: '#F4F5F7'
            }
          },
          keyframes: {
            marquee: {
              '0%': { transform: 'translateX(100%)' },
              '100%': { transform: 'translateX(-100%)' }
            }
          },
          animation: {
            marquee: 'marquee 25s linear infinite'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-comer-gray min-h-screen font-sans text-gray-800">

  <script>
    // ==========================================
    // CONFIGURACIÓN DE GOOGLE SHEETS (MULTI-PESTAÑA)
    // ==========================================
    const URL_BASE_SHEETS = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR5Wxmi1zJBmQNs-uzH9KtI_LfxTbezwHOSD6iNEzzzhE-LrB_cdmxICKJxq2L3Rj1qJGQsqUQvEZ2Z/pub?single=true&output=csv";

    // Pestaña 1: Usuarios (Columnas: USUARIO, DEPARTAMENTO, ¿ADMIN?)
    const URL_HOJA_USUARIOS = URL_BASE_SHEETS + "&gid=0";
    // Pestaña 2: Venta (Indicadores Anuales, Mensuales, Puntualidad, Abasto, etc.)
    const URL_HOJA_VENTA = URL_BASE_SHEETS + "&gid=123456789"; // Reemplaza por el gid real de tu hoja de venta

    // Datos de respaldo por si el fetch offline falla
    let BD_USUARIOS_AUTORIZADOS = [
      { usuario: "Angelo Arturo Hernández González", depto: "Sistemas / Control", admin: "SI" },
      { usuario: "María Guadalupe Pérez López", depto: "Operaciones", admin: "NO" }
    ];

    let BD_VENTA = {
      anual: { anoAnterior: 18450000, anoActual: 21200000, pedidosAnterior: 22100, pedidosActual: 24800, ticketAnterior: 834.84, ticketActual: 854.83, participacion: 18.5 },
      mensual: { mesAnterior: 1520000, mesActual: 1780000, pedidosAnt: 1850, pedidosAct: 2010, ticketAnt: 821.62, ticketAct: 885.57, participacionMes: 19.2 },
      puntualidadArmado: 96.5,
      puntualidadEntrega: 94.2,
      abastoSinSustituto: 92.8,
      abastoConSustituto: 97.4,
      posicionamiento: [
        { depto: "Abarrotes", venta: 6200000 },
        { depto: "Perecederos", venta: 4800000 },
        { depto: "Frutas y Verduras", venta: 3900000 }
      ],
      comentarios: [
        "Excelente atención en el armado de frutas y verduras.",
        "Pedido entregado 10 minutos antes del horario programado.",
        "Muy buen empaque de congelados y productos delicados."
      ]
    };

    let sesionActual = null;

    // Sincronización en vivo
    async function sincronizarDatos() {
      const statusEl = document.getElementById('sync-status');
      try {
        const [respUser, respVenta] = await Promise.all([
          fetch(URL_HOJA_USUARIOS),
          fetch(URL_HOJA_VENTA)
        ]);

        if (respUser.ok) {
          const csvText = await respUser.text();
          parsearUsuariosCSV(csvText);
        }
        if (statusEl) statusEl.innerHTML = '<i class="fas fa-check-circle text-green-600"></i> Sincronizado con Google Sheets en tiempo real';
      } catch (e) {
        if (statusEl) statusEl.innerHTML = '<i class="fas fa-info-circle text-gray-500"></i> Modo local de respaldo activo';
      }
    }

    function parsearUsuariosCSV(csvText) {
      const lineas = csvText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      if (lineas.length <= 1) return;
      const parsed = [];
      for (let i = 1; i < lineas.length; i++) {
        const cols = lineas[i].split(',').map(c => c.replace(/^"|"$/g, '').trim());
        if (cols.length >= 2) {
          parsed.push({
            usuario: cols[0],
            depto: cols[1],
            admin: cols[2] || 'NO'
          });
        }
      }
      if (parsed.length > 0) BD_USUARIOS_AUTORIZADOS = parsed;
    }

    function calcularVar(actual, anterior) {
      if (!anterior || anterior === 0) return 0;
      return ((anterior - actual) / anterior) * 100; // Fórmula solicitada: AÑO ANTERIOR - AÑO ACTUAL / AÑO ANTERIOR
    }

    function formatoMoneda(m) {
      return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN', maximumFractionDigits: 0 }).format(m);
    }
  </script>

  <!-- PANTALLA: LOG IN -->
  <div id="pantalla-login" class="flex items-center justify-center min-h-screen p-4 bg-slate-900">
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md border border-gray-100">
      <div class="text-center mb-6">
        <div class="flex justify-center items-center mb-3">
          <div class="w-16 h-16 bg-comer-orange rounded-2xl flex items-center justify-center text-white text-3xl font-black shadow-lg">
            LC
          </div>
        </div>
        <h1 class="text-2xl font-extrabold text-gray-900 tracking-tight">La Comer en tu Casa</h1>
        <p class="text-xs font-semibold text-comer-orange tracking-widest uppercase mt-1">Portal de Control & Abasto</p>
      </div>

      <div id="sync-status" class="mb-4 p-2 bg-gray-50 rounded-xl text-xs text-center text-gray-500">
        <i class="fas fa-sync fa-spin"></i> Conectando...
      </div>

      <form onsubmit="validarLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">N° Empleado (9 dígitos)</label>
          <input type="text" id="input-empleado" maxlength="9" required pattern="[0-9]{9}" placeholder="Ej. 123456789" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-comer-orange outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Nombre Completo</label>
          <input type="text" id="input-nombre" required placeholder="Nombre registrado" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-comer-orange outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Departamento</label>
          <select id="input-depto" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-comer-orange outline-none text-sm bg-white">
            <option value="">Selecciona tu departamento</option>
            <option value="Sistemas / Control">Sistemas / Control</option>
            <option value="Operaciones">Operaciones</option>
            <option value="Abarrotes">Abarrotes</option>
            <option value="Perecederos">Perecederos</option>
          </select>
        </div>

        <button type="submit" class="w-full bg-comer-orange hover:bg-orange-600 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
          <span>Ingresar al Portal</span>
          <i class="fas fa-arrow-right text-xs"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- PANTALLA: [INICIO] -->
  <div id="pantalla-inicio" class="hidden min-h-screen pb-12">
    <!-- Navbar / Encabezado -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 bg-comer-orange rounded-xl flex items-center justify-center text-white font-black text-xl">LC</div>
          <div>
            <h2 class="text-sm font-bold text-gray-900 leading-none">La Comer en tu Casa</h2>
            <span class="text-[10px] font-semibold text-comer-orange">Portal de Control & Abasto</span>
          </div>
        </div>

        <!-- Perfil y Acciones del Encabezado -->
        <div class="flex items-center gap-4">
          <div class="text-right">
            <p class="text-xs font-bold text-gray-800" id="perfil-nombre"></p>
            <p class="text-[10px] text-gray-500 font-semibold" id="perfil-depto"></p>
          </div>
          <div id="contenedor-admin-btn"></div>
          <button onclick="cerrarSesion()" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-bold transition">
            Cerrar sesión
          </button>
        </div>
      </div>

      <!-- Marquesina de Comentarios (Derecha a Izquierda) -->
      <div class="bg-slate-900 text-white text-xs py-2 overflow-hidden relative border-t border-slate-800">
        <div class="flex items-center">
          <div class="bg-comer-orange text-white text-[10px] font-extrabold uppercase px-3 py-1 z-10 whitespace-nowrap">
            Comentarios de Servicio
          </div>
          <div class="overflow-hidden w-full relative">
            <div id="marquee-box" class="whitespace-nowrap inline-block animate-marquee font-medium"></div>
          </div>
        </div>
      </div>
    </header>

    <!-- Contenido del Dashboard -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 space-y-6">
      
      <!-- Indicadores de Venta: Anual y Mensual -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- Anual -->
        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-black text-gray-900">Venta Anual</h3>
            <span class="px-2.5 py-1 bg-orange-100 text-comer-orange text-xs font-extrabold rounded-full" id="lbl-part-anual">--% Participación</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-xs">
            <div><p class="text-gray-400">Año Ant.</p><p class="font-bold" id="anual-ant">$0</p></div>
            <div><p class="text-gray-400">Año Act.</p><p class="font-bold" id="anual-act">$0</p></div>
            <div><p class="text-gray-400">Variación</p><p class="font-bold" id="anual-var">0%</p></div>
          </div>
        </div>

        <!-- Mensual -->
        <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-base font-black text-gray-900">Venta Mensual</h3>
            <span class="px-2.5 py-1 bg-green-100 text-green-700 text-xs font-extrabold rounded-full" id="lbl-part-mes">--% Participación</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-xs">
            <div><p class="text-gray-400">Mes Ant.</p><p class="font-bold" id="mes-ant">$0</p></div>
            <div><p class="text-gray-400">Mes Act.</p><p class="font-bold" id="mes-act">$0</p></div>
            <div><p class="text-gray-400">Variación</p><p class="font-bold" id="mes-var">0%</p></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    function validarLogin(e) {
      e.preventDefault();
      const emp = document.getElementById('input-empleado').value.trim();
      const nom = document.getElementById('input-nombre').value.trim();
      const dep = document.getElementById('input-depto').value;

      // Validar coincidencia en base de datos de usuarios
      const encontrado = BD_USUARIOS_AUTORIZADOS.find(u => 
        u.usuario.toLowerCase() === nom.toLowerCase() && u.depto === dep
      );

      if (!encontrado) {
        alert("Usuario no autorizado");
        return;
      }

      sesionActual = { emp, nom, dep, admin: encontrado.admin };

      // Cargar datos en pantalla INICIO
      document.getElementById('perfil-nombre').innerText = nom;
      document.getElementById('perfil-depto').innerText = dep;

      if (encontrado.admin === "SI") {
        document.getElementById('contenedor-admin-btn').innerHTML = `
          <button class="px-3 py-1.5 bg-comer-orange text-white rounded-lg text-xs font-bold shadow">Administrator</button>
        `;
      }

      // Renderizar datos de venta
      document.getElementById('anual-ant').innerText = formatoMoneda(BD_VENTA.anual.anoAnterior);
      document.getElementById('anual-act').innerText = formatoMoneda(BD_VENTA.anual.anoActual);
      document.getElementById('anual-var').innerText = calcularVar(BD_VENTA.anual.anoActual, BD_VENTA.anual.anoAnterior).toFixed(1) + '%';
      document.getElementById('lbl-part-anual').innerText = `${BD_VENTA.anual.participacion}% Participación`;

      document.getElementById('mes-ant').innerText = formatoMoneda(BD_VENTA.mensual.mesAnterior);
      document.getElementById('mes-act').innerText = formatoMoneda(BD_VENTA.mensual.mesActual);
      document.getElementById('mes-var').innerText = calcularVar(BD_VENTA.mensual.mesActual, BD_VENTA.mensual.mesAnterior).toFixed(1) + '%';
      document.getElementById('lbl-part-mes').innerText = `${BD_VENTA.mensual.participacionMes}% Participación`;

      // Marquesina
      document.getElementById('marquee-box').innerHTML = BD_VENTA.comentarios.map(c => `<span class="mx-6"><i class="fas fa-comment-dots text-comer-yellow mr-2"></i>"${c}"</span>`).join('');

      // Transición de pantallas
      document.getElementById('pantalla-login').classList.add('hidden');
      document.getElementById('pantalla-inicio').classList.remove('hidden');
    }

    function cerrarSesion() {
      sesionActual = null;
      document.getElementById('pantalla-inicio').classList.add('hidden');
      document.getElementById('pantalla-login').classList.remove('hidden');
    }

    window.onload = sincronizarDatos;
  </script>
</body>
</html>
