<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Comer en tu Casa - Portal de Control & Abasto</title>
    <style>
        :root {
            --primary-orange: #ff6600;
            --primary-orange-hover: #e55c00;
            --success-bg: #e6f4ea;
            --success-color: #137333;
            --error-color: #c5221f;
            --bg-color: rgba(228, 0, 124, 0.3); /* Rosa mexicano al 30% de transparencia */
            --card-bg: #ffffff;
            --text-color: #202124;
            --label-color: #5f6368;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background: var(--card-bg);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
            text-align: center;
        }

        /* Regla de diseño: Contenedor naranja con LCC en su interior */
        .logo-container {
            display: inline-block;
            background-color: var(--primary-orange);
            color: white;
            font-weight: bold;
            font-size: 28px;
            padding: 12px 20px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.3);
            letter-spacing: 1px;
        }

        h1 {
            font-size: 20px;
            color: #111;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .subtitle {
            font-size: 11px;
            color: var(--primary-orange);
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .status-badge {
            background-color: var(--success-bg);
            color: var(--success-color);
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 25px;
            width: 100%;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: bold;
            color: var(--label-color);
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #dadce0;
            border-radius: 10px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
            background-color: #fff;
            color: var(--text-color);
        }

        input:focus, select:focus {
            border-color: var(--primary-orange);
            box-shadow: 0 0 0 2px rgba(255, 102, 0, 0.2);
        }

        button.btn-primary {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-orange);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(255, 102, 0, 0.25);
        }

        button.btn-primary:hover {
            background-color: var(--primary-orange-hover);
        }

        .mensaje {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }

        .error { color: var(--error-color); }
        .success { color: var(--success-color); }

        #dashboard {
            display: none;
            text-align: center;
        }

        .btn-secondary {
            background-color: #5f6368;
            margin-top: 20px;
        }
        .btn-secondary:hover {
            background-color: #484c50;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- FORMULARIO DE ACCESO -->
        <div id="login-section">
            <div class="logo-container">LCC</div>
            <h1>La Comer en tu Casa</h1>
            <div class="subtitle">Portal de Control & Abasto</div>

            <div class="status-badge">
                <span>🟢</span> Sistema Autorizado Activo
            </div>

            <form id="accessForm">
                <div class="form-group">
                    <label for="empleado">N° EMPLEADO (9 DÍGITOS)</label>
                    <input type="text" id="empleado" placeholder="Ej. 742486591" maxlength="9" pattern="[0-9]{9}" required>
                </div>
                <div class="form-group">
                    <label for="nombre">NOMBRE COMPLETO</label>
                    <input type="text" id="nombre" placeholder="Ej. Angelo Arturo..." required>
                </div>
                <div class="form-group">
                    <label for="departamento">DEPARTAMENTO</label>
                    <!-- Cambiado de input a select para lista desplegable -->
                    <select id="departamento" required>
                        <option value="" disabled selected>Cargando departamentos...</option>
                    </select>
                </div>
                <button type="submit" id="btnIngresar" class="btn-primary">Ingresar al Portal &rarr;</button>
            </form>
            <div id="mensajeAlerta" class="mensaje"></div>
        </div>

        <!-- PANEL INTERNO -->
        <div id="dashboard">
            <div class="logo-container">LCC</div>
            <h2>¡Bienvenido, <span id="userNameDisplay"></span>!</h2>
            <p>N° Empleado: <span id="userEmpDisplay"></span></p>
            <p>Departamento: <span id="userDeptoDisplay"></span></p>
            
            <div id="adminBadge" style="display:none; background: #e6f4ea; color: #137333; padding: 10px; border-radius: 8px; margin: 15px 0; font-weight: bold; font-size: 14px;">
                🛡️ Modo Administrador Activado
            </div>
            
            <p class="success">Acceso autorizado correctamente por la base de datos.</p>
            <button onclick="location.reload()" class="btn-primary btn-secondary">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        // Tu URL exacta de Apps Script
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyc7tXRLUR4aiguUk2mq-liDOyG8irBb8tRVG8bmoayNspMvSjkhh_eIghTNx-S9D0HwQ/exec";

        const form = document.getElementById('accessForm');
        const mensajeAlerta = document.getElementById('mensajeAlerta');
        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const userEmpDisplay = document.getElementById('userEmpDisplay');
        const userDeptoDisplay = document.getElementById('userDeptoDisplay');
        const adminBadge = document.getElementById('adminBadge');
        const btnIngresar = document.getElementById('btnIngresar');
        const selectDepartamento = document.getElementById('departamento');

        // 1. Función para cargar los departamentos desde la Columna E al abrir la página
        async function cargarDepartamentos() {
            try {
                const response = await fetch(`${WEB_APP_URL}?action=getDepartamentos`);
                const result = await response.json();
                
                if (result.departments && result.departments.length > 0) {
                    selectDepartamento.innerHTML = '<option value="" disabled selected>Seleccione su departamento</option>';
                    result.departments.forEach(depto => {
                        const option = document.createElement('option');
                        option.value = depto;
                        option.textContent = depto;
                        selectDepartamento.appendChild(option);
                    });
                } else {
                    selectDepartamento.innerHTML = '<option value="" disabled selected>No se encontraron departamentos</option>';
                }
            } catch (error) {
                console.error("Error al cargar departamentos:", error);
                selectDepartamento.innerHTML = '<option value="" disabled selected>Error al cargar lista</option>';
            }
        }

        // Ejecutar la carga al iniciar
        cargarDepartamentos();

        // 2. Manejo del formulario de acceso
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const numEmpleado = document.getElementById('empleado').value.trim();
            const nombre = document.getElementById('nombre').value.trim();
            const departamento = selectDepartamento.value;

            const regex9Digitos = /^[0-9]{9}$/;
            if (!regex9Digitos.test(numEmpleado)) {
                mensajeAlerta.textContent = "El N° de Empleado debe contener exactamente 9 dígitos numéricos.";
                mensajeAlerta.className = "mensaje error";
                return;
            }

            if (!departamento) {
                mensajeAlerta.textContent = "Por favor seleccione un departamento válido.";
                mensajeAlerta.className = "mensaje error";
                return;
            }

            mensajeAlerta.textContent = "Verificando credenciales...";
            mensajeAlerta.className = "mensaje";
            btnIngresar.disabled = true;

            const urlFinal = `${WEB_APP_URL}?nombre=${encodeURIComponent(nombre)}&departamento=${encodeURIComponent(departamento)}`;

            try {
                const response = await fetch(urlFinal);
                const result = await response.json();

                if (result.access) {
                    mensajeAlerta.textContent = "";
                    loginSection.style.display = "none";
                    dashboard.style.display = "block";
                    
                    userNameDisplay.textContent = nombre;
                    userEmpDisplay.textContent = numEmpleado;
                    userDeptoDisplay.textContent = departamento;

                    if (result.isAdmin) {
                        adminBadge.style.display = "block";
                    }
                } else {
                    mensajeAlerta.textContent = result.message || "Acceso denegado. Verifique sus datos.";
                    mensajeAlerta.className = "mensaje error";
                    btnIngresar.disabled = false;
                }
            } catch (error) {
                console.error("Error:", error);
                mensajeAlerta.textContent = "Error de conexión con el servidor.";
                mensajeAlerta.className = "mensaje error";
                btnIngresar.disabled = false;
            }
        });
    </script>
</body>
</html>
